# The build does not run on push. Two ways to start it:
#   Actions → Debian 12 → Run workflow, then pick dev or master.
#   Publish a release. GitHub reads this file from the default branch
#   and checks out the release tag, then attaches the zips next to the
#   source archives. A draft does not start a build; publishing it does.
# The Run workflow button is listed only when this file is on the
# default branch, and the chosen branch must contain this file too.
#
# The job runs on a GitHub-hosted Ubuntu runner only so that checkout and
# artifact upload have git and Node. The compile itself is debian:12:
# configure runs native test programs (AC_TRY_RUN) and must not be
# cross-compiled. amd64 is the runner's own platform. arm64 is the same
# debian:12 image under QEMU: gcc, the test programs, and the finished
# binaries are all aarch64. Debian's name for that architecture is arm64;
# uname -m prints aarch64. See .github/scripts/build-debian12.sh.

name: Debian 12

on:
  workflow_dispatch:
  release:
    # published covers a normal release and a pre-release. created does
    # not run for a draft, but it also does not mean the release is public
    # yet. published is the moment the source archives appear.
    types: [published]

jobs:
  build:
    name: debian-12-${{ matrix.arch }}
    runs-on: ubuntu-latest
    # gh release upload needs to add assets. Manual runs only upload
    # Actions artifacts, which the same token can do with contents: read,
    # but one permission set covers both triggers.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # binfmt_misc on the amd64 runner, so the arm64 container can execute
      # the aarch64 binaries that configure builds. The amd64 job does not
      # need it. Docker Desktop already registers this locally.
      - name: Register QEMU for arm64
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build and pack in Debian 12
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            debian:12 \
            bash /src/.github/scripts/build-debian12.sh

      # archive: false uploads the zip as itself. The default wraps it
      # again and names the download qico-debian12-<arch>.zip, which is
      # not the name build-debian12.sh put on the drop. With archive
      # false the artifact name is the filename:
      # qico-<version>-debian12-<arch>-<sha>.zip
      - name: Upload binary drop
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error

      # GitHub already attached the source zip and tarball. This adds the
      # binary drop beside them. --clobber replaces the same filename when
      # the workflow is re-run for one release. Each architecture uploads
      # its own zip; the names differ by amd64 / arm64.
      - name: Attach the drop to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
